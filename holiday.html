<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Caribbean Itinerary</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0c0c10;
    --bg-mid:    #111118;
    --surface:   #111118;
    --surface-2: #15151e;
    --border:    rgba(255,255,255,0.07);
    --border-mid:rgba(255,255,255,0.12);
    --gold:      #b89a5a;
    --gold-pale: #d4b97a;
    --gold-tint: rgba(184,154,90,0.10);
    --text:      #c8c8d4;
    --text-dim:  #6a6a7a;
    --white:     #e8e8f0;
    --radius:    4px;
    --maxw:      880px;
    --header:    rgba(12,12,16,0.95);
    --serif:     'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  :root[data-theme="light"] {
    --bg:        #faf8f4;
    --bg-mid:    #f2eee6;
    --surface:   #ffffff;
    --surface-2: #f4f1ea;
    --border:    rgba(26,24,20,0.10);
    --border-mid:rgba(26,24,20,0.20);
    --gold:      #8a6d28;
    --gold-pale: #6d5520;
    --gold-tint: rgba(138,109,40,0.10);
    --text:      #3a3832;
    --text-dim:  #76726a;
    --white:     #15140f;
    --header:    rgba(250,248,244,0.95);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  a { color: var(--gold-pale); text-decoration: none; }
  a:hover { color: var(--white); }
  strong { color: var(--white); font-weight: 500; }

  /* ---------- Access gate ---------- */
  #gate {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(184,154,90,0.07), transparent 65%),
      var(--bg);
  }
  #gate .box {
    width: 100%;
    max-width: 330px;
    text-align: center;
  }
  #gate .mark {
    font-family: var(--serif);
    font-size: 0.95rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
  }
  #gate h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 300;
    line-height: 1.2;
    color: var(--white);
    margin-bottom: 8px;
  }
  #gate p {
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 26px;
  }
  #pin {
    width: 100%;
    font-family: var(--sans);
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    text-align: center;
    padding: 14px 12px;
    color: var(--white);
    background: var(--surface);
    border: 1px solid var(--border-mid);
    border-radius: var(--radius);
  }
  #pin::placeholder { color: var(--text-dim); letter-spacing: 0.3em; }
  #pin:focus { outline: none; border-color: var(--gold); }
  #gate button {
    margin-top: 12px;
    width: 100%;
    padding: 13px 16px;
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--gold);
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.25s ease;
  }
  #gate button:hover { background: var(--gold-pale); }
  #gate button:disabled { opacity: 0.55; cursor: default; }
  #err {
    min-height: 1.3em;
    margin-top: 14px;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    color: var(--gold-pale);
  }

  /* ---------- Shell ---------- */
  #app { display: none; }
  header.top {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 20px 24px 14px;
  }
  .bar .mark {
    font-family: var(--serif);
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .bar h1 {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.1;
    color: var(--white);
  }
  .bar .dates {
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin-top: 4px;
  }
  nav.jump {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.jump::-webkit-scrollbar { display: none; }
  nav.jump a {
    flex: 0 0 auto;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border-mid);
    border-radius: 999px;
    padding: 7px 15px;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
  }
  nav.jump a:hover {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }
  nav.jump a:active { transform: translateY(1px); }
  nav.jump a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .bar { position: relative; }
  #theme {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--border-mid);
    border-radius: 50%;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #theme:hover { color: var(--gold-pale); border-color: var(--gold); }
  #theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  :root[data-theme="light"] #theme .moon { display: none; }
  :root:not([data-theme="light"]) #theme .sun { display: none; }

  img.hero {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 6px 0 20px;
    height: 200px;
    object-fit: cover;
    border: 1px solid var(--border);
    filter: saturate(0.92);
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .gallery figure { position: relative; background: var(--surface); }
  .gallery img { display: block; width: 100%; height: 118px; object-fit: cover; filter: saturate(0.92); }
  .gallery figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 10px 7px;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.78), transparent);
  }
  .credit { margin-top: 14px; font-size: 0.76rem; color: var(--text-dim); }

  main { max-width: var(--maxw); margin: 0 auto; padding: 8px 24px 80px; }
  section { padding-top: 48px; scroll-margin-top: 140px; }
  h2 {
    font-family: var(--serif);
    font-size: 1.75rem;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h3 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 12px;
  }
  p { margin-bottom: 13px; }
  .lede { font-size: 1.05rem; color: var(--text); }
  .meta { font-size: 0.92rem; color: var(--text-dim); }
  .meta strong, .note strong { color: var(--text); }
  .note {
    font-size: 0.88rem;
    color: var(--text-dim);
    background: var(--surface-2);
    border-left: 2px solid var(--gold);
    padding: 11px 15px;
  }
  .label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 22px 0 10px;
  }

  /* at a glance */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .card {
    background: var(--surface);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .card .k {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .card strong { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; line-height: 1.3; }
  .card .sub, .sub { color: var(--text-dim); font-size: 0.84rem; }

  /* flights */
  ul.flights { list-style: none; border: 1px solid var(--border); }
  ul.flights li {
    display: flex;
    gap: 20px;
    align-items: baseline;
    background: var(--surface);
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
  }
  ul.flights li:last-child { border-bottom: 0; }
  ul.flights .code {
    flex: 0 0 74px;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--gold);
  }
  ul.flights div { display: flex; flex-direction: column; gap: 2px; }
  ul.flights strong { font-weight: 400; }

  /* days */
  article.day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--gold);
    padding: 24px;
    margin-bottom: 16px;
  }
  article.day h3 .date {
    display: block;
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  article.day p:last-child { margin-bottom: 0; }
  .stay {
    font-size: 0.9rem;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 14px 16px;
  }

  ul.run { list-style: none; margin-bottom: 16px; }
  ul.run li {
    display: flex;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.93rem;
  }
  ul.run li:last-child { border-bottom: 0; }
  ul.run .t {
    flex: 0 0 122px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--white);
  }

  /* cruise table */
  .scroll { overflow-x: auto; border: 1px solid var(--border); }
  table.ports { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 480px; background: var(--surface); }
  table.ports th {
    text-align: left;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 13px 18px;
    border-bottom: 1px solid var(--border-mid);
    background: var(--surface-2);
  }
  table.ports td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.ports tr:last-child td { border-bottom: 0; }
  table.ports td:first-child { white-space: nowrap; color: var(--white); font-weight: 400; }
  table.ports td.sea { color: var(--text-dim); font-style: italic; }
  .tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--gold-pale);
    background: var(--gold-tint);
    border: 1px solid var(--border-mid);
    padding: 1px 9px;
    margin-left: 6px;
    white-space: nowrap;
  }

  /* lists */
  ul.todo { list-style: none; }
  ul.todo li {
    position: relative;
    padding: 10px 0 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  ul.todo li:last-child { border-bottom: 0; }
  ul.todo li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 1.15em;
    width: 5px;
    height: 5px;
    background: var(--gold);
  }
  ul.contacts { list-style: none; border: 1px solid var(--border); }
  ul.contacts li {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    justify-content: space-between;
    align-items: baseline;
    background: var(--surface);
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  ul.contacts li:last-child { border-bottom: 0; }
  ul.contacts .who { color: var(--text-dim); }

  footer {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px 56px;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  @media (max-width: 560px) {
    .bar h1 { font-size: 1.3rem; }
    section { padding-top: 38px; }
    h2 { font-size: 1.5rem; }
    article.day { padding: 20px 18px; }
    img.hero { height: 150px; margin: 4px 0 16px; }
    ul.run li { flex-direction: column; gap: 1px; }
    ul.run .t { flex: none; font-size: 0.8rem; letter-spacing: 0.06em; color: var(--gold); }
    ul.flights li { flex-direction: column; gap: 4px; }
    ul.flights .code { flex: none; }
  }
  @media print {
    #gate { display: none !important; }
    body { background: #fff; color: #000; }
    header.top { position: static; }
    nav.jump, #theme, img.hero, .gallery { display: none; }
    article.day, .card, ul.flights li, .scroll, table.ports { background: #fff; color: #000; break-inside: avoid; }
    h1, h2, h3, strong, .card strong, table.ports td:first-child, ul.run .t { color: #000; }
    a { color: #000; }
  }
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateForm">
    <div class="mark">Kramlem</div>
    <h1>Caribbean Itinerary</h1>
    <p>Enter the 6-digit access code</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Access code" placeholder="••••••">
    <button type="submit" id="go">Open</button>
    <div id="err" role="status" aria-live="polite"></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <div class="bar">
      <div class="mark">Kramlem</div>
      <h1>Caribbean Itinerary</h1>
      <div class="dates">11 Dec 2026 – 7 Jan 2027 · Mark, Melanie, Harrison &amp; Charlize</div>
      <button id="theme" type="button" aria-label="Switch between light and dark">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <nav class="jump">
      <a href="#overview">At a glance</a>
      <a href="#flights">Flights</a>
      <a href="#days">Day by day</a>
      <a href="#cruise">Cruise</a>
      <a href="#todo">Still to sort</a>
      <a href="#contacts">Contacts</a>
    </nav>
  </header>
  <main id="content"></main>
  <footer>Private family itinerary. Times are local; Florida is EST in December.</footer>
</div>

<script>
(function () {
  // Theme: dark by default, remembered per device.
  var saved = null;
  try { saved = localStorage.getItem('cbnTheme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#theme')) return;
    var now = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', now);
    try { localStorage.setItem('cbnTheme', now); } catch (e2) {}
  });
})();

  var SALT = "HKsz5GwhrMnm0+CU4lOtDA==";
  var IV = "oh/63WYT8PAvFa76";
  var ITER = 600000;

  var gate = document.getElementById('gate');
  var form = document.getElementById('gateForm');
  var pin = document.getElementById('pin');
  var go = document.getElementById('go');
  var err = document.getElementById('err');
  var app = document.getElementById('app');
  var content = document.getElementById('content');

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function reveal(html) {
    content.innerHTML = html;
    gate.style.display = 'none';
    app.style.display = 'block';
  }

  async function unlock(code) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    var clear = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(PAYLOAD));
    return new TextDecoder().decode(clear);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var code = pin.value.trim();
    if (!code) return;
    go.disabled = true;
    err.textContent = '';
    go.textContent = 'Checking…';
    try {
      var html = await unlock(code);
      try { localStorage.setItem('cbnPin', code); } catch (e2) {}
      reveal(html);
    } catch (e3) {
      err.textContent = 'That code did not work.';
      pin.value = '';
      pin.focus();
    } finally {
      go.disabled = false;
      go.textContent = 'Open';
    }
  });

  // Remember the code on this device so it only has to be typed once.
  (async function () {
    var saved = null;
    try { saved = localStorage.getItem('cbnPin'); } catch (e) {}
    if (!saved) { pin.focus(); return; }
    try { reveal(await unlock(saved)); }
    catch (e) { try { localStorage.removeItem('cbnPin'); } catch (e2) {} pin.focus(); }
  })();
})();
