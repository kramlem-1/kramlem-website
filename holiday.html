<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Caribbean Itinerary</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #faf8f4;
    --bg-mid:    #f2eee6;
    --surface:   #ffffff;
    --surface-2: #f4f1ea;
    --border:    rgba(26,24,20,0.10);
    --border-mid:rgba(26,24,20,0.20);
    --gold:      #8a6d28;
    --gold-pale: #6d5520;
    --gold-tint: rgba(138,109,40,0.10);
    --text:      #3a3832;
    --text-dim:  #76726a;
    --white:     #15140f;
    --header:    rgba(250,248,244,0.95);
    --radius:    6px;
    --radius-lg: 14px;
    --maxw:      880px;
    --serif:     'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  a { color: var(--gold-pale); text-decoration: none; }
  a:hover { color: var(--white); }
  strong { color: var(--white); font-weight: 500; }

  /* ---------- Access gate ---------- */
  #gate {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse at 50% 0%, var(--gold-tint), transparent 65%),
      var(--bg);
  }
  #gate .box {
    width: 100%;
    max-width: 330px;
    text-align: center;
  }
  #gate .mark {
    font-family: var(--serif);
    font-size: 0.95rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
  }
  #gate h1 {
    font-family: var(--serif);
    font-size: 1.9rem;
    font-weight: 300;
    line-height: 1.2;
    color: var(--white);
    margin-bottom: 8px;
  }
  #gate p {
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 26px;
  }
  #pin {
    width: 100%;
    font-family: var(--sans);
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    text-align: center;
    padding: 14px 12px;
    color: var(--white);
    background: var(--surface);
    border: 1px solid var(--border-mid);
    border-radius: var(--radius);
  }
  #pin::placeholder { color: var(--text-dim); letter-spacing: 0.3em; }
  #pin:focus { outline: none; border-color: var(--gold); }
  #gate button {
    margin-top: 12px;
    width: 100%;
    padding: 13px 16px;
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--gold);
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.25s ease;
  }
  #gate button:hover { background: var(--gold-pale); }
  #gate button:disabled { opacity: 0.55; cursor: default; }
  #err {
    min-height: 1.3em;
    margin-top: 14px;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    color: var(--gold-pale);
  }

  /* ---------- Shell ---------- */
  #app { display: none; }
  header.top {
    background: var(--header);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 20px 24px 14px;
  }
  .bar .mark {
    font-family: var(--serif);
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .bar h1 {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 300;
    line-height: 1.1;
    color: var(--white);
  }
  .bar .dates {
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin-top: 4px;
  }
  nav.jump {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 10px 24px;
    background: var(--header);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  nav.jump > * { flex: 0 0 auto; }
  nav.jump .ico { display: none; }
  nav.jump a {
    flex: 0 0 auto;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border-mid);
    border-radius: 999px;
    padding: 6px 13px;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
  }
  nav.jump a:hover {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }
  nav.jump a#today {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }
  nav.jump a#today:hover { background: var(--gold-pale); border-color: var(--gold-pale); }
  nav.jump a:active { transform: translateY(1px); }
  nav.jump a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  nav.jump .ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  img.hero {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 6px 0 20px;
    height: 200px;
    object-fit: cover;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    filter: saturate(0.92);
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .gallery figure { position: relative; background: var(--surface); }
  .gallery img { display: block; width: 100%; height: 118px; object-fit: cover; filter: saturate(0.92); }
  .gallery figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 10px 7px;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.78), transparent);
  }
  .credit { margin-top: 14px; font-size: 0.76rem; color: var(--text-dim); }

  main { max-width: var(--maxw); margin: 0 auto; padding: 8px 24px 80px; }
  .bar, nav.jump { max-width: var(--maxw); margin-left: auto; margin-right: auto; }
  section { padding-top: 48px; scroll-margin-top: 92px; }
  article.day { scroll-margin-top: 78px; }
  h2 {
    font-family: var(--serif);
    font-size: 1.75rem;
    font-weight: 300;
    color: var(--white);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h3 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--white);
    margin-bottom: 12px;
  }
  p { margin-bottom: 13px; }
  .lede { font-size: 1.05rem; color: var(--text); }
  .meta { font-size: 0.92rem; color: var(--text-dim); }
  .meta strong, .note strong { color: var(--text); }
  .note {
    font-size: 0.88rem;
    color: var(--text-dim);
    background: var(--surface-2);
    border-left: 2px solid var(--gold);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 11px 15px;
  }
  .label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 22px 0 10px;
  }

  /* at a glance */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .card {
    background: var(--surface);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .card .k {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .card strong { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; line-height: 1.3; }
  .card .sub, .sub { color: var(--text-dim); font-size: 0.84rem; }

  /* flights */
  ul.flights { list-style: none; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  ul.flights li {
    display: flex;
    gap: 20px;
    align-items: baseline;
    background: var(--surface);
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
  }
  ul.flights li:last-child { border-bottom: 0; }
  ul.flights .code {
    flex: 0 0 74px;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--gold);
  }
  ul.flights div { display: flex; flex-direction: column; gap: 2px; }
  ul.flights strong { font-weight: 400; }

  /* days */
  article.day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--gold);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 16px;
  }
  article.day h3 .date {
    display: block;
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  article.day p:last-child { margin-bottom: 0; }
  .stay {
    font-size: 0.9rem;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  ul.run { list-style: none; margin-bottom: 16px; }
  ul.run li {
    position: relative;
    padding: 8px 0 8px 140px;
    border-bottom: 1px solid var(--border);
    font-size: 0.93rem;
  }
  ul.run li:last-child { border-bottom: 0; }
  ul.run .t {
    position: absolute;
    left: 0;
    top: 8px;
    width: 126px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--white);
  }

  /* cruise table */
  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
  table.ports { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 480px; background: var(--surface); }
  table.ports th {
    text-align: left;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 13px 18px;
    border-bottom: 1px solid var(--border-mid);
    background: var(--surface-2);
  }
  table.ports td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.ports tr:last-child td { border-bottom: 0; }
  table.ports td:first-child { white-space: nowrap; color: var(--white); font-weight: 400; }
  table.ports td.sea { color: var(--text-dim); font-style: italic; }
  table.refs { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 460px; background: var(--surface); }
  table.refs th {
    text-align: left;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 13px 18px;
    border-bottom: 1px solid var(--border-mid);
    background: var(--surface-2);
  }
  table.refs td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.refs tr:last-child td { border-bottom: 0; }
  table.refs td:first-child { white-space: nowrap; color: var(--text-dim); }
  table.refs td.ref {
    white-space: nowrap;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--white);
  }
  .tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--gold-pale);
    background: var(--gold-tint);
    border: 1px solid var(--border-mid);
    padding: 1px 9px;
    margin-left: 6px;
    white-space: nowrap;
  }

  /* lists */
  ul.todo { list-style: none; }
  ul.todo li {
    position: relative;
    padding: 10px 0 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  ul.todo li:last-child { border-bottom: 0; }
  ul.todo li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 1.15em;
    width: 5px;
    height: 5px;
    background: var(--gold);
  }
  ul.contacts { list-style: none; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  ul.contacts li {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    justify-content: space-between;
    align-items: baseline;
    background: var(--surface);
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  ul.contacts li:last-child { border-bottom: 0; }
  ul.contacts .who { color: var(--text-dim); }

  footer {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px 56px;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  @media (max-width: 560px) {
    nav.jump {
      position: fixed;
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      flex-wrap: nowrap;
      gap: 0;
      padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      border-bottom: 0;
      box-shadow: 0 -2px 14px rgba(0,0,0,0.10);
    }
    nav.jump a {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 0;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      color: var(--text-dim);
    }
    nav.jump a .ico { display: block; width: 21px; height: 21px; }
    nav.jump a .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    nav.jump a:hover { background: transparent; color: var(--gold); border: 0; }
    nav.jump a#today {
      color: var(--bg);
      background: var(--gold);
      border: 0;
      flex: 0 0 46px;
      margin-right: 2px;
    }
    nav.jump a#today:hover { color: var(--bg); background: var(--gold); }
    body { padding-bottom: 60px; }
    section { scroll-margin-top: 16px; }
    article.day { scroll-margin-top: 12px; }
    .bar h1 { font-size: 1.3rem; }
    section { padding-top: 38px; }
    h2 { font-size: 1.5rem; }
    article.day { padding: 20px 18px; }
    img.hero { height: 150px; margin: 4px 0 16px; }
    ul.run li { padding: 8px 0 9px; }
    ul.run .t {
      position: static;
      display: block;
      width: auto;
      margin-bottom: 1px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    ul.flights li { flex-direction: column; gap: 4px; }
    ul.flights .code { flex: none; }
  }
  @media print {
    #gate { display: none !important; }
    body { background: #fff; color: #000; }
    header.top { position: static; }
    nav.jump, img.hero, .gallery { display: none; }
    article.day, .card, ul.flights li, .scroll, table.ports { background: #fff; color: #000; break-inside: avoid; }
    h1, h2, h3, strong, .card strong, table.ports td:first-child, ul.run .t { color: #000; }
    a { color: #000; }
  }
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateForm">
    <div class="mark">Kramlem</div>
    <h1>Caribbean Itinerary</h1>
    <p>Enter the 6-digit access code</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Access code" placeholder="••••••">
    <button type="submit" id="go">Open</button>
    <div id="err" role="status" aria-live="polite"></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <div class="bar">
      <div class="mark">Kramlem</div>
      <h1>Caribbean Itinerary</h1>
      <div class="dates">11 Dec 2026 – 7 Jan 2027 · Mark, Melanie, Harrison &amp; Charlize</div>
    </div>
  </header>
  <!-- Nav icons: Lucide 1.70.0, ISC licence, https://lucide.dev -->
  <nav class="jump">
      <a href="#days" id="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg><span class="lbl">Today</span></a>
      <a href="#overview"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">At a glance</span></a>
      <a href="#flights"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><span class="lbl">Flights</span></a>
      <a href="#cruise"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v2"/><path d="M12 9.189V13"/><path d="M19 12V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 19A11.6 11.6 0 0 0 21 13l-8.188-3.639a2 2 0 0 0-1.624 0L3 13.001a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 20c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg><span class="lbl">Cruise</span></a>
      <a href="#contacts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg><span class="lbl">Contacts</span></a>
      <a href="#refs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg><span class="lbl">Bookings</span></a>
      <a href="#payments"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></svg><span class="lbl">Payments</span></a>
  </nav>
  <main id="content"></main>
  <footer>Private family itinerary. Times are local; Florida is EST in December.</footer>
</div>

<script>
(function () {
  var ITER = 600000;
  // Two payloads, each encrypted under its own code. The shared one leaves out

  var gate = document.getElementById('gate');
  var form = document.getElementById('gateForm');
  var pin = document.getElementById('pin');
  var go = document.getElementById('go');
  var err = document.getElementById('err');
  var app = document.getElementById('app');
  var content = document.getElementById('content');

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Where "Today" should land: the matching day card, the cruise section while
  // at sea, the first day before the trip, the last day once it is over.
  function todayTarget() {
    var days = content.querySelectorAll('article.day[data-date]');
    if (!days.length) return '#days';
    var now = new Date();
    var today = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');

    var first = days[0].getAttribute('data-date');
    var last = days[days.length - 1].getAttribute('data-date');
    if (today < first) return '#' + days[0].id;
    if (today > last) return '#' + days[days.length - 1].id;

    for (var i = 0; i < days.length; i++) {
      if (days[i].getAttribute('data-date') === today) return '#' + days[i].id;
    }
    // Between listed days: at sea, so the cruise table is the useful view.
    return content.querySelector('#cruise') ? '#cruise' : '#days';
  }

  function reveal(html) {
    content.innerHTML = html;
    // Drop nav pills whose section is not in this copy of the page.
    var links = document.querySelectorAll('nav.jump a[href^="#"]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (links[i].id === 'today') continue;
      if (!content.querySelector(href)) links[i].remove();
    }
    var today = document.getElementById('today');
    if (today) {
      var set = function () { today.setAttribute('href', todayTarget()); };
      set();
      today.addEventListener('click', set);   // re-resolve in case the page sat open overnight
    }
    gate.style.display = 'none';
    app.style.display = 'block';
  }

  async function unlock(code) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    for (var n = 0; n < VAULTS.length; n++) {
      var v = VAULTS[n];
      try {
        var key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(v.s), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        var clear = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(v.i) }, key, bytes(v.p));
        return new TextDecoder().decode(clear);
      } catch (e) { /* wrong vault for this code — try the next */ }
    }
    throw new Error('bad code');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var code = pin.value.trim();
    if (!code) return;
    go.disabled = true;
    err.textContent = '';
    go.textContent = 'Checking…';
    try {
      var html = await unlock(code);
      try { localStorage.setItem('cbnPin', code); } catch (e2) {}
      reveal(html);
    } catch (e3) {
      err.textContent = 'That code did not work.';
      pin.value = '';
      pin.focus();
    } finally {
      go.disabled = false;
      go.textContent = 'Open';
    }
  });

  // Remember the code on this device so it only has to be typed once.
  (async function () {
    var saved = null;
    try { saved = localStorage.getItem('cbnPin'); } catch (e) {}
    if (!saved) { pin.focus(); return; }
    try { reveal(await unlock(saved)); }
    catch (e) { try { localStorage.removeItem('cbnPin'); } catch (e2) {} pin.focus(); }
  })();
})();
