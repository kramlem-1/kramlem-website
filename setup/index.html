<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kramlem Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg:      #090910;
      --surface: #0f0f1b;
      --border:  #1c1c30;
      --text:    #e8e8f4;
      --dim:     #5a5a88;
      --accent:  #7c9eff;
      --error:   #ff6b6b;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .logo {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .subtitle {
      font-size: 0.9rem;
      color: var(--dim);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    input[type="password"] {
      width: 100%;
      padding: 0.9rem 1.1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: #090910;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button[type="submit"]:hover { opacity: 0.85; }
    button[type="submit"]:active { opacity: 0.7; }

    .error {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.25);
      border-radius: 0.75rem;
      font-size: 0.9rem;
      color: var(--error);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">Kramlem <span>Dashboard</span></div>
    <div class="subtitle">Enter your password to continue</div>
  </div>

  <!-- Show error if redirected back after a wrong password -->
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.write('<div class="error">&#10007;&nbsp; Incorrect password — try again</div>');
    }
  </script>

  <form action="/api/login" method="POST">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      autofocus
      required
      placeholder="••••••••••••"
    >
    <button type="submit">Enter Dashboard &rarr;</button>
  </form>
</div>

</body>
</html>
