<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kramlem Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /*
     * Layout : hero clock (top 40%) + two-panel info row (bottom 60%)
     * Color  : deep navy-black bg, cool-white text, amber warm, teal cool
     * Type   : Space Grotesk (clock / headings) · Inter (body / data)
     * Theme  : dark-only — deliberate choice for TV viewing
     */
    :root {
      color-scheme: dark;
      --bg:      #090910;
      --surface: #0f0f1b;
      --border:  #1c1c30;
      --text:    #e8e8f4;
      --dim:     #5a5a88;
      --accent:  #7c9eff;
      --warm:    #ffb347;
      --teal:    #4ecdc4;
      --font-d:  'Space Grotesk', system-ui, sans-serif;
      --font-b:  'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg); /* fallback when no photo */
      color: var(--text);
      font-family: var(--font-b);
      cursor: none;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 2fr 3fr;
      position: relative;
      z-index: 1;
    }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      gap: 0.6vh;
    }

    .date-line {
      font-family: var(--font-b);
      font-size: 2vh;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .clock {
      font-family: var(--font-d);
      font-size: 21vh;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .clock .sec {
      font-size: 0.42em;
      color: var(--dim);
      vertical-align: 0.18em;
    }

    /* ── PANELS ── */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .panel {
      padding: 3vh 4vw;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }

    .label {
      font-size: 1.2vh;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 2.2vh;
    }

    /* ── WEATHER ── */
    .wx-row {
      display: flex;
      align-items: flex-start;
      gap: 2.5vw;
      margin-bottom: 2.5vh;
    }

    .wx-icon  { font-size: 7vh; line-height: 1; flex-shrink: 0; }

    .wx-temp {
      font-family: var(--font-d);
      font-size: 9.5vh;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .wx-temp sup { font-size: 0.38em; color: var(--dim); vertical-align: 0.55em; }

    .wx-desc { font-size: 2vh; color: var(--dim); margin-top: 0.4vh; }

    .wx-stats {
      display: flex;
      gap: 2.8vw;
      padding-top: 2.2vh;
      border-top: 1px solid var(--border);
    }

    .stat { display: flex; flex-direction: column; gap: 0.3vh; }
    .stat-l { font-size: 1.1vh; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .stat-v { font-family: var(--font-d); font-size: 2.5vh; font-variant-numeric: tabular-nums; }

    .forecast {
      display: flex;
      gap: 1.5vw;
      margin-top: 2.5vh;
      padding-top: 2.2vh;
      border-top: 1px solid var(--border);
    }

    .fc-day {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5vh;
    }
    .fc-name  { font-size: 1.1vh; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .fc-icon  { font-size: 2.6vh; }
    .fc-temps { font-size: 1.7vh; font-variant-numeric: tabular-nums; }
    .fc-hi    { color: var(--warm); }
    .fc-sep   { color: var(--border); }
    .fc-lo    { color: var(--dim); }

    /* ── FAMILY ── */
    .greeting {
      font-family: var(--font-d);
      font-size: 4.2vh;
      font-weight: 300;
      line-height: 1.25;
      margin-bottom: 3vh;
    }
    .greeting .accent { color: var(--accent); }

    .day-pill {
      display: inline-block;
      padding: 0.35vh 1.1vh;
      border-radius: 100px;
      font-size: 1.3vh;
      font-weight: 500;
      letter-spacing: 0.06em;
      vertical-align: 0.3em;
      margin-left: 0.6vw;
    }
    .day-pill.school  { background: rgba(78,205,196,.12); color: var(--teal);   border: 1px solid rgba(78,205,196,.25); }
    .day-pill.weekend { background: rgba(124,158,255,.12); color: var(--accent); border: 1px solid rgba(124,158,255,.25); }
    .day-pill.holiday { background: rgba(255,179,71,.12);  color: var(--warm);  border: 1px solid rgba(255,179,71,.25); }

    .events { display: flex; flex-direction: column; gap: 2.2vh; }

    /* ── CALENDAR EVENTS ── */
    .cal-block { margin-top: 2.5vh; }

    .cal-block-label {
      font-size: 1.1vh;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1.2vh;
    }

    .cal-event {
      padding: 1.4vh 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .cal-event:last-child { border-bottom: none; }

    .cal-event-name { font-size: 2.4vh; font-weight: 400; color: var(--text); line-height: 1.2; }
    .cal-event-meta { font-size: 1.6vh; color: var(--dim); }
    .cal-event-loc  { font-size: 1.4vh; color: var(--dim); opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }

    .cal-nothing { font-size: 1.9vh; color: var(--dim); font-style: italic; }

    .cal-date-prefix { color: var(--accent); font-weight: 500; }

    /* ── COUNTDOWN ── */
    .countdown-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.5vh;
    }

    .cd-emoji { font-size: 6vh; line-height: 1; }

    .cd-days {
      font-family: var(--font-d);
      font-size: 14vh;
      font-weight: 300;
      line-height: 1;
      color: var(--warm);
      font-variant-numeric: tabular-nums;
    }

    .cd-unit {
      font-size: 1.8vh;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--warm);
      opacity: 0.7;
      margin-top: -1vh;
    }

    .cd-name {
      font-family: var(--font-d);
      font-size: 3.2vh;
      font-weight: 300;
      color: var(--text);
      margin-top: 0.5vh;
    }

    .cd-date {
      font-size: 1.5vh;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    .cd-hms {
      font-family: var(--font-d);
      font-size: 2.8vh;
      font-weight: 300;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    .cd-today {
      font-family: var(--font-d);
      font-size: 7vh;
      font-weight: 300;
      color: var(--warm);
    }

    /* ── PHOTO BACKGROUND ── */
    #photo-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
    }

    #photo-bg-next {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
    }

    /* Dark overlay so text stays readable over photos */
    #photo-bg::after, #photo-bg-next::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 16, 0.70);
    }

    /* Fade transition on the outgoing layer */
    #photo-bg.fading {
      transition: opacity 2s ease;
      opacity: 0;
    }

    /* ── STATUS ── */
    #status {
      position: fixed;
      bottom: 1.5vh;
      right: 2vw;
      font-size: 1.1vh;
      color: var(--border);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div id="photo-bg-next"></div>
<div id="photo-bg"></div>
<div class="app">

  <div class="hero">
    <div class="date-line" id="date-line">MONDAY, 17 NOVEMBER 2026</div>
    <div class="clock">
      <span id="hhmm">10:34</span><span class="sec" id="ss">:52</span>
    </div>
  </div>

  <div class="panels">

    <!-- Weather -->
    <div class="panel">
      <div class="label" id="wx-label">Weather — Sydney</div>
      <div class="wx-row">
        <div class="wx-icon" id="wx-icon">⛅</div>
        <div>
          <div class="wx-temp"><span id="wx-temp">—</span><sup>°C</sup></div>
          <div class="wx-desc" id="wx-desc">Loading…</div>
        </div>
      </div>
      <div class="wx-stats">
        <div class="stat">
          <span class="stat-l">Feels like</span>
          <span class="stat-v" id="wx-feels">—°</span>
        </div>
        <div class="stat">
          <span class="stat-l">High</span>
          <span class="stat-v" id="wx-high" style="color:var(--warm)">—°</span>
        </div>
        <div class="stat">
          <span class="stat-l">Low</span>
          <span class="stat-v" id="wx-low">—°</span>
        </div>
        <div class="stat">
          <span class="stat-l">Humidity</span>
          <span class="stat-v" id="wx-hum">—%</span>
        </div>
        <div class="stat">
          <span class="stat-l">Sunrise</span>
          <span class="stat-v" id="wx-rise" style="color:var(--warm)">—</span>
        </div>
        <div class="stat">
          <span class="stat-l">Sunset</span>
          <span class="stat-v" id="wx-set">—</span>
        </div>
      </div>
      <div class="forecast" id="forecast"></div>
    </div>

    <!-- Family -->
    <div class="panel" style="overflow-y:auto;">
      <div class="label">Today</div>
      <div class="greeting">
        Good <span id="greeting">morning</span>,
        <span class="accent" id="family-name">Kramlems</span><span class="day-pill" id="day-pill"></span>
      </div>
      <div id="cal-today" class="cal-block"></div>
      <div id="cal-upcoming" class="cal-block"></div>
    </div>

    <!-- Countdown -->
    <div class="panel countdown-panel" id="countdown-panel">
      <div class="cd-emoji">🌴</div>
      <div class="cd-days" id="cd-days">—</div>
      <div class="cd-unit" id="cd-unit">days to go</div>
      <div class="cd-name" id="cd-name">Caribbean</div>
      <div class="cd-hms" id="cd-hms"></div>
      <div class="cd-date" id="cd-date"></div>
    </div>

  </div>
</div>

<div id="status">—</div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  CONFIG — edit to customise
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const C = {
  city:       'Sydney',
  familyName: 'Kramlems',
  timeZone:   'Australia/Sydney',

  /* School days (0=Sun … 6=Sat) */
  schoolDays: [1,2,3,4,5],

  weatherRefreshMins:  30,
  calendarRefreshMins: 15,
  pageRefreshMins:     60,

  /* Caribbean holiday countdown */
  holidayDate: '2026-12-11',
  holidayName: 'Caribbean',
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  CLOCK
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function tick() {
  const now = new Date();

  document.getElementById('hhmm').textContent =
    now.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', hour12:false });
  document.getElementById('ss').textContent =
    ':' + String(now.getSeconds()).padStart(2,'0');

  document.getElementById('date-line').textContent =
    now.toLocaleDateString('en-AU', {
      weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).toUpperCase();

  const h = now.getHours();
  document.getElementById('greeting').textContent =
    h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';

  document.getElementById('family-name').textContent = C.familyName;

  const dow = now.getDay();
  const pill = document.getElementById('day-pill');
  if (dow === 0 || dow === 6) {
    pill.className = 'day-pill weekend';
    pill.textContent = 'Weekend';
  } else if (C.schoolDays.includes(dow)) {
    pill.className = 'day-pill school';
    pill.textContent = 'School day';
  } else {
    pill.className = 'day-pill holiday';
    pill.textContent = 'No school';
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  CALENDAR
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

// Return 'YYYY-MM-DD' in Sydney timezone for any Date/ISO string
function sydDate(iso) {
  return new Date(iso).toLocaleDateString('en-CA', { timeZone: C.timeZone });
}

function fmtTime(iso, allDay) {
  if (allDay) return 'All day';
  return new Date(iso).toLocaleTimeString('en-AU', {
    timeZone: C.timeZone, hour: 'numeric', minute: '2-digit', hour12: true
  });
}

function fmtTimeRange(start, end, allDay) {
  if (allDay) return 'All day';
  const s = fmtTime(start, false);
  if (!end) return s;
  return s + ' – ' + fmtTime(end, false);
}

function fmtDay(iso) {
  return new Date(iso).toLocaleDateString('en-AU', {
    timeZone: C.timeZone, weekday: 'short', day: 'numeric', month: 'short'
  });
}

function renderCalendar(events) {
  const todayStr = sydDate(new Date());
  const now      = new Date();

  // Today: started today and not yet ended (or all-day today)
  const todayEvs = events.filter(e => {
    if (sydDate(e.start) !== todayStr) return false;
    if (!e.allDay && e.end && new Date(e.end) < now) return false;
    return true;
  });

  // Upcoming: starts after today, within 14 days
  const upcomingEvs = events
    .filter(e => sydDate(e.start) > todayStr)
    .slice(0, 4);

  const todayEl    = document.getElementById('cal-today');
  const upcomingEl = document.getElementById('cal-upcoming');

  todayEl.innerHTML = '<div class="cal-block-label">Today</div>' + (
    todayEvs.length
      ? todayEvs.map(e => `
          <div class="cal-event">
            <div class="cal-event-name">${e.summary}</div>
            <div class="cal-event-meta">${fmtTimeRange(e.start, e.end, e.allDay)}</div>
            ${e.location ? `<div class="cal-event-loc">📍 ${e.location}</div>` : ''}
          </div>`)
        .join('')
      : '<div class="cal-nothing">Nothing on today</div>'
  );

  upcomingEl.innerHTML = upcomingEvs.length
    ? '<div class="cal-block-label">Coming up</div>' +
      upcomingEvs.map(e => `
        <div class="cal-event">
          <div class="cal-event-name">
            <span class="cal-date-prefix">${fmtDay(e.start)} </span>${e.summary}
          </div>
          <div class="cal-event-meta">${fmtTimeRange(e.start, e.end, e.allDay)}</div>
          ${e.location ? `<div class="cal-event-loc">📍 ${e.location}</div>` : ''}
        </div>`)
      .join('')
    : '';
}

async function fetchCalendar() {
  try {
    const res  = await fetch('/api/calendar');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (data.events) renderCalendar(data.events);
  } catch {
    document.getElementById('cal-today').innerHTML =
      '<div class="cal-block-label">Today</div>' +
      '<div class="cal-nothing">Calendar unavailable</div>';
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  WEATHER
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function wxIcon(code) {
  code = +code;
  if (code === 113) return '☀️';
  if (code <= 116)  return '⛅';
  if (code <= 119)  return '☁️';
  if (code <= 143)  return '🌫️';
  if (code <= 176)  return '🌦️';
  if (code <= 179)  return '🌨️';
  if (code <= 185)  return '🌧️';
  if (code <= 200)  return '⛈️';
  if (code <= 230)  return '❄️';
  if (code <= 260)  return '🌫️';
  if (code <= 299)  return '🌦️';
  if (code <= 320)  return '🌧️';
  if (code <= 335)  return '🌨️';
  if (code <= 395)  return '⛈️';
  return '🌡️';
}

async function fetchWeather() {
  document.getElementById('wx-label').textContent = `Weather — ${C.city}`;
  try {
    const res  = await fetch(`https://wttr.in/${encodeURIComponent(C.city)}?format=j1`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const cur   = data.current_condition[0];
    const today = data.weather[0];
    const days  = data.weather.slice(0, 3);

    document.getElementById('wx-icon').textContent  = wxIcon(cur.weatherCode);
    document.getElementById('wx-temp').textContent  = cur.temp_C;
    document.getElementById('wx-desc').textContent  = cur.weatherDesc[0].value;
    document.getElementById('wx-feels').textContent = cur.FeelsLikeC + '°';
    document.getElementById('wx-high').textContent  = today.maxtempC + '°';
    document.getElementById('wx-low').textContent   = today.mintempC + '°';
    document.getElementById('wx-hum').textContent   = cur.humidity + '%';

    const fmt = s => s.replace(/ AM$/,'am').replace(/ PM$/,'pm');
    document.getElementById('wx-rise').textContent = fmt(today.astronomy[0].sunrise);
    document.getElementById('wx-set').textContent  = fmt(today.astronomy[0].sunset);

    const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    document.getElementById('forecast').innerHTML = days.map((d, i) => {
      const name = i === 0 ? 'Today' : DAY[new Date(d.date).getDay()];
      const mid  = d.hourly[Math.floor(d.hourly.length / 2)];
      return `<div class="fc-day">
        <span class="fc-name">${name}</span>
        <span class="fc-icon">${wxIcon(mid?.weatherCode ?? 113)}</span>
        <span class="fc-temps">
          <span class="fc-hi">${d.maxtempC}°</span><span class="fc-sep"> / </span><span class="fc-lo">${d.mintempC}°</span>
        </span>
      </div>`;
    }).join('');

    document.getElementById('status').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', hour12:false });
  } catch {
    document.getElementById('wx-desc').textContent = 'Weather unavailable';
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  COUNTDOWN
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function tickCountdown() {
  const target = new Date(C.holidayDate + 'T00:00:00');
  const now    = new Date();
  const diff   = target - now;

  const daysEl = document.getElementById('cd-days');
  const hmsEl  = document.getElementById('cd-hms');
  const nameEl = document.getElementById('cd-name');
  const dateEl = document.getElementById('cd-date');

  nameEl.textContent = C.holidayName;
  dateEl.textContent = target.toLocaleDateString('en-AU', {
    day: 'numeric', month: 'long', year: 'numeric'
  });

  if (diff <= 0) {
    // Holiday is today or past
    const panel = document.getElementById('countdown-panel');
    panel.innerHTML = `
      <div class="cd-emoji">🌴</div>
      <div class="cd-today">It's time!</div>
      <div class="cd-name">${C.holidayName}</div>
    `;
    return;
  }

  const totalSecs = Math.floor(diff / 1000);
  const days  = Math.floor(totalSecs / 86400);
  const hours = Math.floor((totalSecs % 86400) / 3600);
  const mins  = Math.floor((totalSecs % 3600) / 60);
  const secs  = totalSecs % 60;

  const unitEl = document.getElementById('cd-unit');

  if (days < 7) {
    // Final week: show days + HH:MM:SS
    daysEl.textContent = days;
    unitEl.textContent = days === 1 ? 'day to go' : 'days to go';
    hmsEl.textContent =
      String(hours).padStart(2,'0') + ':' +
      String(mins).padStart(2,'0')  + ':' +
      String(secs).padStart(2,'0');
  } else {
    // Show days and hours
    daysEl.textContent = days;
    unitEl.textContent = (days === 1 ? 'day' : 'days') + ' ' + hours + (hours === 1 ? ' hr' : ' hrs') + ' to go';
    hmsEl.textContent = '';
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  PHOTO SLIDESHOW
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let _photos = [];
let _photoIdx = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function preloadImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => resolve(url);
    img.src = url;
  });
}

async function showNextPhoto() {
  if (!_photos.length) return;

  const bg   = document.getElementById('photo-bg');
  const next = document.getElementById('photo-bg-next');

  _photoIdx = (_photoIdx + 1) % _photos.length;
  const url = _photos[_photoIdx];

  // Preload into the back layer
  await preloadImage(url);
  next.style.backgroundImage = `url('${url}')`;
  next.style.zIndex = '-1';
  bg.style.zIndex   = '-2';

  // Swap z-index after a tick so the transition is visible
  requestAnimationFrame(() => {
    bg.classList.add('fading');
    setTimeout(() => {
      bg.style.backgroundImage  = `url('${url}')`;
      bg.style.zIndex           = '-1';
      next.style.zIndex         = '-2';
      bg.classList.remove('fading');
    }, 2000);
  });
}

const STATIC_PHOTOS = [
  '/dashboard/photos/family-caribbean.jpg',
];

async function fetchPhotos() {
  try {
    const res  = await fetch('/api/photos');
    if (!res.ok) throw new Error('api error');
    const data = await res.json();
    const list = (data.photos && data.photos.length) ? data.photos : STATIC_PHOTOS;
    _photos = shuffle(list);
    _photoIdx = -1;
    showNextPhoto(); // show first photo immediately
  } catch {
    _photos = shuffle(STATIC_PHOTOS);
    _photoIdx = -1;
    showNextPhoto();
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  BOOT
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
tick();
tickCountdown();
setInterval(() => { tick(); tickCountdown(); }, 1000);

fetchCalendar();
setInterval(fetchCalendar, C.calendarRefreshMins * 60_000);

fetchWeather();
setInterval(fetchWeather, C.weatherRefreshMins * 60_000);

fetchPhotos();
setInterval(showNextPhoto, 60_000); // rotate photo every minute

setTimeout(() => location.reload(), C.pageRefreshMins * 60_000);
</script>
